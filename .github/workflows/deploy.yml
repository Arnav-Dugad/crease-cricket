name: Deploy

# Deploys to Cloudflare Workers on every push to main, and rebuilds the Cricsheet
# historical data weekly so stats, models and matchups stay current.
# Requires repository secret CLOUDFLARE_API_TOKEN (template: "Edit Cloudflare Workers").

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d4aa89c49b6ea701c27e4a9711dce381
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.creds.outputs.skip != 'true'
        run: npm ci
      - name: Cache Cricsheet downloads
        if: steps.creds.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: scripts/cricsheet/.cache
          key: cricsheet-${{ github.run_id }}
          restore-keys: cricsheet-
      - name: Build historical data (Cricsheet)
        if: steps.creds.outputs.skip != 'true'
        run: npm run data:build
      - name: Build app
        if: steps.creds.outputs.skip != 'true'
        run: npm run build
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.skip != 'true'
        run: npx wrangler deploy
